# strategy-dashboard на сервере n — отдельный контейнер + свой MySQL.
# Запуск: docker compose -f docker-compose.deploy.yml up -d --build
# Батчи:  docker compose -f docker-compose.deploy.yml exec app npx tsx scripts/run-batch-now.ts ...
services:
  db:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: strategy_dashboard
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - sd_dbdata:/var/lib/mysql
    networks: [sdnet]

  app:
    build:
      context: .
      dockerfile: Dockerfile.deploy
    restart: unless-stopped
    env_file: .env.deploy
    environment:
      - DATABASE_URL=mysql://root@db:3306/strategy_dashboard
      - GOOGLE_SERVICE_ACCOUNT_KEY=/secrets/analytics-sa.json
      - DISABLE_BOTS=true
    volumes:
      - ./analytics-sa.json:/secrets/analytics-sa.json:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on: [db]
    networks: [sdnet]

networks:
  sdnet:

volumes:
  sd_dbdata:
