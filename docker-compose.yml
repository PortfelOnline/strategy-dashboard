services:
  db:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${SD_DB_PASSWORD}
      MYSQL_DATABASE: strategy_dashboard
    volumes:
      - sd_db:/var/lib/mysql
    networks: [sdnet]

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: "mysql://root:${SD_DB_PASSWORD}@db:3306/strategy_dashboard"
      PORT: "3000"
    expose:
      - "3000"
    volumes:
      - ./analytics-sa.json:/secrets/analytics-sa.json:ro
    depends_on: [db]
    networks: [sdnet]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [app]
    networks: [sdnet]

networks:
  sdnet:

volumes:
  sd_db:
  caddy_data:
